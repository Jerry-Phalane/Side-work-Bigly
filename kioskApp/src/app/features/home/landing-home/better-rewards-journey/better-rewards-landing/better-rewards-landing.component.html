<section class="better-rewards-content">
  <div class="tiles-marquee" aria-hidden="true">
    <div class="tiles-track tiles-track-left">
      @for (tile of rowOneLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" decoding="async" />
      </div>
      }
    </div>

    <div class="tiles-track tiles-track-right">
      @for (tile of rowTwoLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" decoding="async" />
      </div>
      }
    </div>
  </div>

  <div class="content-card">
    <h1>
      <span class="headline-accent">Save</span> really, <em>really</em> big on the
      <br />
      brands you love
    </h1>
    <p>
      Better Rewards gets you instant discounts on all your favourite brands.
      <br />
      Take a short shopping trip to find out how your savings stack up
    </p>
    <button type="button" class="cta-button" mat-flat-button (click)="goToNextStep()">Let's go!</button>
  </div>
</section>
