<section class="better-rewards-content">
  <div class="tiles-marquee" aria-hidden="true">
    <div class="tiles-track tiles-track-left">
      @for (tile of rowOneLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" />
      </div>
      }
    </div>

    <div class="tiles-track tiles-track-right">
      @for (tile of rowTwoLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" />
      </div>
      }
    </div>
  </div>

  <div class="content">
    <h1>
      Save more with
      <br />
      Better Rewards brands
    </h1>
    <p>
      <span class="copy-line copy-line-primary">
        We can help you save even more off our products items. Use our simulation
      </span>
      <span class="copy-line">to see what you can do to save more!</span>
    </p>
    <div class="content-divider"></div>
    <button type="button" class="cta-button" mat-flat-button (click)="goToNextStep()">
      <span class="cta-label">See how you can save</span>
      <mat-icon class="cta-icon" iconPositionEnd aria-hidden="true">arrow_forward</mat-icon>
    </button>
  </div>
</section>
