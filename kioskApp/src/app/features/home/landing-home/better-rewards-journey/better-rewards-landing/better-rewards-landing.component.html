<section class="better-rewards-content">
  <div class="tiles-marquee" aria-hidden="true">
    <div class="tiles-track tiles-track-left">
      @for (tile of rowOneLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" />
      </div>
      }
    </div>

    <div class="tiles-track tiles-track-right">
      @for (tile of rowTwoLoopTiles; track tile.id) {
      <div class="tile">
        <img [src]="tile.src" [alt]="tile.alt" />
      </div>
      }
    </div>
  </div>

  <div class="content">
    <h1>Save more on the things you love</h1>
    <p>
      Better Rewards gets you instant discounts on all your favourite brands, every time you shop. Take a short
      shopping trip with us to see how.
    </p>
    <div class="content-divider"></div>
    <button type="button" class="cta-button" mat-flat-button (click)="goToNextStep()">
      <span class="cta-label">Let's go!</span>
      <mat-icon class="cta-icon" aria-hidden="true">arrow_forward</mat-icon>
    </button>
  </div>
</section>
