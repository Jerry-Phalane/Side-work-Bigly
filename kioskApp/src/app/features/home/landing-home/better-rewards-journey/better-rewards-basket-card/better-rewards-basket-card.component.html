<button type="button" class="basket-card" [class.selected]="selected" (click)="selectCard()">
  <div class="basket-media" aria-hidden="true">
    <span class="basket-badge">+B</span>
    <div class="basket-media-strip">
      <img class="basket-media-image" [src]="imagePath" alt="" />
    </div>
  </div>
  <span class="basket-title">{{ title }}</span>
  <span class="basket-item-count">{{ itemCount }}</span>
  <span class="basket-price">{{ price }}</span>
</button>
